name: Chay Script Scrape khi trigger

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Tai code ve (Checkout)
      uses: actions/checkout@v3

    - name: 2. Thiet lap Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. Tao file credentials.json
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: |
        echo "$GOOGLE_CREDENTIALS" > credentials.json
        echo "Da tao file credentials.json"

    - name: 4. Tao file stv_cookies.json
      env:
        STV_COOKIES: ${{ secrets.STV_COOKIES }}
      run: |
        echo "$STV_COOKIES" > stv_cookies.json
        echo "Da tao file stv_cookies.json"

    - name: 5. Cai dat thu vien Python
      run: |
        pip install gspread requests beautifulsoup4

    - name: 6. Chay script Python
      run: python addNew.py
