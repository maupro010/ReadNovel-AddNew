name: Chay Script Scrape khi trigger

on:
  workflow_dispatch:
  
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 gspread google-auth playwright
          playwright install chrome --with-deps   # cài Chrome thật

      - name: Install Xvfb (display ảo cho headless=False)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Write Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Run scraper với Xvfb
        env:
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USER:   ${{ secrets.PROXY_USER }}
          PROXY_PASS:   ${{ secrets.PROXY_PASS }}
        run: |
          # Xvfb tạo display ảo :99, Chrome dùng display này
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python addNew.py
